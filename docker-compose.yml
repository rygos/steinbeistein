services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL muss in .env gesetzt sein}
      HOSTNAME: 0.0.0.0
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD muss gesetzt sein}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss gesetzt sein}
      REBRICKABLE_API_KEY: ${REBRICKABLE_API_KEY:-}
      BRICKOWL_API_KEY: ${BRICKOWL_API_KEY:-}
      BRICKOWL_COUNTRY: ${BRICKOWL_COUNTRY:-DE}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://bricks.rygos.de}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.steinbeistein.rule=Host(`bricks.rygos.de`)
      - traefik.http.routers.steinbeistein.entrypoints=websecure
      - traefik.http.routers.steinbeistein.tls=true
      - traefik.http.routers.steinbeistein.tls.certresolver=tls_resolver
      - traefik.http.services.steinbeistein.loadbalancer.server.port=3000
    networks:
      - default
      - proxy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://'+require('node:os').hostname()+':3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lego
      POSTGRES_USER: lego
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lego -d lego"]
      interval: 10s
      timeout: 5s
      retries: 5
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: lego
      POSTGRES_USER: lego
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - postgres_backups:/backups
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  postgres_backups:
networks:
  proxy:
    external: true
